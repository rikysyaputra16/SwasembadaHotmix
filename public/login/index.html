<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Swasembada Hotmix RT</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102015;background:#eef4ef}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#edf5ef 0%,#f8fbf8 52%,#eef5ef 100%);position:relative;overflow:hidden}
    body::before{content:"";position:fixed;inset:-7%;z-index:0;pointer-events:none;background:url("/login-map") center center/min(1120px,96vw) auto no-repeat;opacity:.18;filter:grayscale(1) sepia(.14) hue-rotate(68deg) saturate(.75) contrast(.9);transform:scale(1.12) rotate(-1deg);transform-origin:center}
    body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(247,251,248,.26) 0 23%,rgba(238,246,240,.55) 54%,rgba(238,246,240,.84) 100%),linear-gradient(120deg,rgba(224,239,229,.28),rgba(255,255,255,.18))}
    .card{position:relative;z-index:2;width:min(430px,100%);background:rgba(255,255,255,.95);border:1px solid rgba(211,226,216,.95);border-radius:22px;box-shadow:0 24px 60px rgba(15,55,30,.16);padding:30px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .brand{display:flex;gap:14px;align-items:center;margin-bottom:24px}.mark{width:54px;height:54px;border-radius:16px;background:#0b4a2a;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 8px 20px rgba(11,74,42,.18)}
    h1{font-size:22px;margin:0 0 4px}.subtitle{margin:0;color:#627067;font-size:14px}label{display:block;font-weight:700;font-size:14px;margin:16px 0 7px}
    input{width:100%;border:1px solid #cddbd1;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:rgba(255,255,255,.92)}input:focus{border-color:#0b6a3a;box-shadow:0 0 0 3px rgba(11,106,58,.12)}
    button{width:100%;margin-top:20px;border:0;border-radius:12px;padding:13px 16px;font-weight:800;font-size:15px;background:#0b4a2a;color:#fff;cursor:pointer;box-shadow:0 10px 22px rgba(11,74,42,.14)}button:hover{background:#0a5730}button:disabled{opacity:.65;cursor:wait}
    .error{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;background:#fff1f1;color:#9b1c1c;font-size:14px}.error.show{display:block}
    .note{margin-top:18px;color:#6a766d;font-size:12px;line-height:1.55;text-align:center}
    @media (max-width:700px){body{padding:18px}body::before{inset:-4%;background-size:auto 118vh;opacity:.12;transform:scale(1.03)}body::after{background:rgba(239,246,241,.72)}.card{padding:24px;border-radius:18px}}
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="mark">RT</div><div><h1>Swasembada Hotmix</h1><p class="subtitle">RT 01 / RW 14 Cendrawasih</p></div></div>
    <form id="loginForm" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button id="loginBtn" type="submit">Masuk</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div class="note">Akses hanya untuk pengguna yang telah diberikan hak oleh Panitia Pelaksana.</div>
  </main>
  <script>
    const form=document.getElementById("loginForm"),button=document.getElementById("loginBtn"),errorBox=document.getElementById("error");
    (async()=>{try{const response=await fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"});if(response.ok)location.replace("/");}catch(_e){}})();
    form.addEventListener("submit",async(event)=>{
      event.preventDefault();errorBox.classList.remove("show");button.disabled=true;button.textContent="Memeriksa...";
      try{
        const response=await fetch("/api/auth/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value})});
        const payload=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(payload.error||"Login gagal.");
        location.replace("/");
      }catch(error){errorBox.textContent=error.message||"Login gagal.";errorBox.classList.add("show");form.password.value="";form.password.focus();button.disabled=false;button.textContent="Masuk";}
    });
  </script>
</body>
</html>
